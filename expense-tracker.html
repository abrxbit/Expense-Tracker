<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Expense Tracker</title>
<style>
  :root{
    --paper:#f2ede3;
    --paper-dark:#e7dfcf;
    --ink:#232323;
    --ink-soft:#5b564c;
    --stamp-red:#a3372f;
    --stamp-green:#3c6e4a;
    --rule:#c9beac;
    --mono: 'Courier New', Courier, monospace;
    --serif: Georgia, 'Times New Roman', serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--paper-dark);
    font-family: var(--mono);
    color: var(--ink);
    min-height:100vh;
    padding: 32px 16px;
    display:flex;
    justify-content:center;
  }
  .receipt{
    width:100%;
    max-width:480px;
    background: var(--paper);
    box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    padding: 28px 24px 36px;
    position:relative;
  }
  .receipt::before, .receipt::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height:14px;
    background:
      radial-gradient(circle at 8px 7px, var(--paper-dark) 7px, transparent 7.5px) repeat-x;
    background-size: 22px 14px;
  }
  .receipt::before{ top:-7px; }
  .receipt::after{ bottom:-7px; transform: rotate(180deg); }

  header{ text-align:center; margin-bottom:18px; }
  .eyebrow{
    font-size:11px;
    letter-spacing:3px;
    color: var(--ink-soft);
    text-transform:uppercase;
  }
  h1{
    font-family: var(--serif);
    font-size: 30px;
    margin: 4px 0 2px;
    letter-spacing: 1px;
  }
  .sub{ font-size:11px; color:var(--ink-soft); }

  .rule{
    border:none;
    border-top: 1px dashed var(--rule);
    margin: 18px 0;
  }

  .totals{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 6px;
  }
  .totals .label{ font-size:12px; letter-spacing:1px; color:var(--ink-soft); text-transform:uppercase;}
  .totals .amount{
    font-family: var(--serif);
    font-size: 34px;
    font-variant-numeric: tabular-nums;
  }
  .amount.neg{ color: var(--stamp-red); }
  .amount.pos{ color: var(--stamp-green); }

  .balance-bar{
    height:6px;
    background: var(--rule);
    margin: 10px 0 4px;
    position:relative;
    overflow:hidden;
  }
  .balance-bar > div{
    position:absolute; top:0; bottom:0; left:0;
    background: var(--stamp-red);
    transition: width .3s ease;
  }

  form{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 18px 0 4px;
  }
  form input, form select{
    font-family: var(--mono);
    font-size: 13px;
    padding: 9px 8px;
    border: 1px solid var(--rule);
    background: #fffdf8;
    color: var(--ink);
  }
  form .desc{ grid-column: 1 / -1; }
  form .amt-row{ display:flex; gap:8px; grid-column: 1 / -1; }
  form .amt-row select{ width: 90px; flex-shrink:0; }
  form .amt-row input{ flex:1; }
  form button{
    grid-column: 1 / -1;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 11px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
    transition: background .15s ease;
  }
  form button:hover{ background:#3a3a3a; }
  form button:active{ transform: translateY(1px); }

  .type-toggle{
    display:flex;
    grid-column: 1 / -1;
    border: 1px solid var(--rule);
    overflow:hidden;
  }
  .type-toggle button{
    flex:1;
    padding:8px;
    font-family: var(--mono);
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    background: #fffdf8;
    color: var(--ink-soft);
    border:none;
    cursor:pointer;
    grid-column: auto;
  }
  .type-toggle button.active[data-type="expense"]{ background: var(--stamp-red); color:#fff; }
  .type-toggle button.active[data-type="income"]{ background: var(--stamp-green); color:#fff; }

  .entries{ margin-top: 18px; }
  .entries .head-row{
    display:flex;
    justify-content:space-between;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .entry{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 9px 0;
    border-bottom: 1px dotted var(--rule);
    font-size: 13px;
    gap: 8px;
  }
  .entry .meta{ min-width:0; }
  .entry .desc{ font-weight:bold; }
  .entry .cat{ color: var(--ink-soft); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .entry .right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .entry .val{ font-variant-numeric: tabular-nums; white-space:nowrap; }
  .entry .val.neg{ color: var(--stamp-red); }
  .entry .val.pos{ color: var(--stamp-green); }
  .entry .del{
    background:none; border:none; cursor:pointer;
    color: var(--ink-soft);
    font-size: 15px;
    line-height:1;
    padding: 2px 4px;
  }
  .entry .del:hover{ color: var(--stamp-red); }

  .empty{
    text-align:center;
    color: var(--ink-soft);
    font-size: 12px;
    padding: 24px 0;
    font-style: italic;
  }

  .breakdown{ margin-top: 20px; }
  .breakdown h2{
    font-family: var(--serif);
    font-size: 14px;
    letter-spacing: 1px;
    margin: 0 0 10px;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .bd-row{ margin-bottom: 8px; }
  .bd-row .top{
    display:flex; justify-content:space-between;
    font-size: 12px; margin-bottom: 3px;
  }
  .bd-track{ height:5px; background:var(--paper-dark); }
  .bd-fill{ height:100%; background: var(--ink); }

  footer{
    text-align:center;
    margin-top: 22px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  ::selection{ background: var(--ink); color: var(--paper); }
</style>
</head>
<body>

<div class="receipt">
  <header>
    <div class="eyebrow">Personal Account</div>
    <h1>Ledger</h1>
    <div class="sub" id="today"></div>
  </header>

  <div class="totals">
    <div>
      <div class="label">Balance</div>
      <div class="amount" id="balanceAmt">$0.00</div>
    </div>
  </div>
  <div class="balance-bar"><div id="balanceBar"></div></div>

  <hr class="rule">

  <form id="entryForm">
    <div class="type-toggle">
      <button type="button" data-type="expense" class="active">− Expense</button>
      <button type="button" data-type="income">+ Income</button>
    </div>
    <input type="text" class="desc" id="descInput" placeholder="Description (e.g. Coffee)" required maxlength="40">
    <select id="catInput">
      <option>Food</option>
      <option>Transport</option>
      <option>Housing</option>
      <option>Utilities</option>
      <option>Entertainment</option>
      <option>Health</option>
      <option>Shopping</option>
      <option>Income</option>
      <option>Other</option>
    </select>
    <div class="amt-row">
      <select id="currencyInput">
        <option value="$">$</option>
        <option value="€">€</option>
        <option value="£">£</option>
        <option value="৳">৳</option>
      </select>
      <input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0.01" required>
    </div>
    <button type="submit">Record Entry</button>
  </form>

  <div class="entries">
    <div class="head-row">
      <span>Entries</span>
      <span id="entryCount">0</span>
    </div>
    <div id="entryList"></div>
    <div class="empty" id="emptyMsg">No entries yet — record your first one above.</div>
  </div>

  <div class="breakdown" id="breakdown" style="display:none;">
    <h2>By Category</h2>
    <div id="breakdownList"></div>
  </div>

  <footer>— end of statement —</footer>
</div>

<script>
  let entries = [];
  let currentType = 'expense';
  let idCounter = 1;

  const form = document.getElementById('entryForm');
  const descInput = document.getElementById('descInput');
  const catInput = document.getElementById('catInput');
  const amountInput = document.getElementById('amountInput');
  const currencyInput = document.getElementById('currencyInput');
  const entryList = document.getElementById('entryList');
  const emptyMsg = document.getElementById('emptyMsg');
  const entryCount = document.getElementById('entryCount');
  const balanceAmt = document.getElementById('balanceAmt');
  const balanceBar = document.getElementById('balanceBar');
  const breakdown = document.getElementById('breakdown');
  const breakdownList = document.getElementById('breakdownList');
  const typeButtons = document.querySelectorAll('.type-toggle button');

  document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  typeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      typeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentType = btn.dataset.type;
    });
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const desc = descInput.value.trim();
    const amount = parseFloat(amountInput.value);
    if (!desc || !amount || amount <= 0) return;

    entries.unshift({
      id: idCounter++,
      desc,
      category: catInput.value,
      amount,
      currency: currencyInput.value,
      type: currentType,
      date: new Date()
    });

    form.reset();
    descInput.focus();
    render();
  });

  function deleteEntry(id){
    entries = entries.filter(e => e.id !== id);
    render();
  }

  function formatMoney(sym, val){
    return sym + Math.abs(val).toFixed(2);
  }

  function render(){
    entryList.innerHTML = '';
    entryCount.textContent = entries.length;
    emptyMsg.style.display = entries.length === 0 ? 'block' : 'none';

    let balance = 0;
    let totalIncome = 0;
    let totalExpense = 0;
    const symbol = entries.length ? entries[0].currency : '$';

    entries.forEach(entry => {
      const signed = entry.type === 'income' ? entry.amount : -entry.amount;
      balance += convertToPrimary(entry, symbol);
      if (entry.type === 'income') totalIncome += entry.amount;
      else totalExpense += entry.amount;

      const row = document.createElement('div');
      row.className = 'entry';
      row.innerHTML = `
        <div class="meta">
          <div class="desc">${escapeHtml(entry.desc)}</div>
          <div class="cat">${entry.category}</div>
        </div>
        <div class="right">
          <div class="val ${entry.type === 'income' ? 'pos' : 'neg'}">
            ${entry.type === 'income' ? '+' : '−'}${formatMoney(entry.currency, entry.amount)}
          </div>
          <button class="del" title="Delete entry" data-id="${entry.id}">✕</button>
        </div>
      `;
      entryList.appendChild(row);
    });

    entryList.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', () => deleteEntry(parseInt(btn.dataset.id)));
    });

    balanceAmt.textContent = (balance < 0 ? '−' : '') + formatMoney(symbol, balance);
    balanceAmt.className = 'amount ' + (balance < 0 ? 'neg' : 'pos');

    const total = totalIncome + totalExpense;
    const pct = total > 0 ? Math.min(100, (totalExpense / total) * 100) : 0;
    balanceBar.style.width = pct + '%';

    renderBreakdown(symbol);
  }

  function convertToPrimary(entry, symbol){
    return entry.type === 'income' ? entry.amount : -entry.amount;
  }

  function renderBreakdown(symbol){
    const expenseEntries = entries.filter(e => e.type === 'expense');
    if (expenseEntries.length === 0){
      breakdown.style.display = 'none';
      return;
    }
    breakdown.style.display = 'block';

    const byCat = {};
    let max = 0;
    expenseEntries.forEach(e => {
      byCat[e.category] = (byCat[e.category] || 0) + e.amount;
      if (byCat[e.category] > max) max = byCat[e.category];
    });

    breakdownList.innerHTML = '';
    Object.entries(byCat)
      .sort((a, b) => b[1] - a[1])
      .forEach(([cat, amt]) => {
        const row = document.createElement('div');
        row.className = 'bd-row';
        const pct = (amt / max) * 100;
        row.innerHTML = `
          <div class="top"><span>${cat}</span><span>${formatMoney(symbol, amt)}</span></div>
          <div class="bd-track"><div class="bd-fill" style="width:${pct}%"></div></div>
        `;
        breakdownList.appendChild(row);
      });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  render();
</script>

</body>
</html>
