<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="receipt">
  <header>
    <div class="eyebrow">Personal Account</div>
    <h1>Ledger</h1>
    <div class="sub" id="today"></div>
  </header>

  <div class="totals">
    <div>
      <div class="label">Balance</div>
      <div class="amount" id="balanceAmt">$0.00</div>
    </div>
  </div>
  <div class="balance-bar"><div id="balanceBar"></div></div>

  <hr class="rule">

  <form id="entryForm">
    <div class="type-toggle">
      <button type="button" data-type="expense" class="active">− Expense</button>
      <button type="button" data-type="income">+ Income</button>
    </div>
    <input type="text" class="desc" id="descInput" placeholder="Description (e.g. Coffee)" required maxlength="40">
    <select id="catInput">
      <option>Food</option>
      <option>Transport</option>
      <option>Housing</option>
      <option>Utilities</option>
      <option>Entertainment</option>
      <option>Health</option>
      <option>Shopping</option>
      <option>Income</option>
      <option>Other</option>
    </select>
    <div class="amt-row">
      <select id="currencyInput">
        <option value="$">$</option>
        <option value="€">€</option>
        <option value="£">£</option>
        <option value="৳">৳</option>
      </select>
      <input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0.01" required>
    </div>
    <button type="submit">Record Entry</button>
  </form>

  <div class="entries">
    <div class="head-row">
      <span>Entries</span>
      <span id="entryCount">0</span>
    </div>
    <div id="entryList"></div>
    <div class="empty" id="emptyMsg">No entries yet — record your first one above.</div>
  </div>

  <div class="breakdown" id="breakdown" style="display:none;">
    <h2>By Category</h2>
    <div id="breakdownList"></div>
  </div>

  <footer>— end of statement —</footer>
</div>

<script src="script.js"></script>
</body>
</html>
